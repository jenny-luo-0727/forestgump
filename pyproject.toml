[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forestgump"
version = "0.1.0"
description = "Life is like a box of baselines. Did your cheminformatics model beat a random forest trained on Morgan fingerprints?"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jenny Luo", email = "jennyluo@berkeley.edu" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "rdkit>=2023.9",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]
keywords = ["baselines", "random-forest", "cheminformatics", "morgan-fingerprint", "rdkit", "model-evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
forestgump = "forestgump.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/forestgump"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
